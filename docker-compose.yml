services:
  tubesync:
    image: ghcr.io/meeb/tubesync:latest
    container_name: tubesync
    restart: always
    stop_grace_period: 30m
    ports:
      - ${TUBESYNC_PORT:-4848}:4848
    volumes:
      - ./config:/config
      - /mnt/user/media-data/media/youtube:/downloads
    environment:
      - TZ=America/New_York
      - PUID=1000
      - PGID=1000
networks:
  homelab_stack:
    external: true
